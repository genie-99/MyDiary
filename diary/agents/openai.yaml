interface:
  display_name: "Study Diary"
  short_description: "Publish Issues and layered, beginner-friendly reviews."
  default_prompt: "Use $diary to publish one labelled Issue per study topic, index it in MyDiary, write a layered Notion CodingStudy review with a key summary, connected flow, plain-language explanations, examples, execution walkthroughs, and misconception corrections, and map it to earlier learning."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Notion MCP server for CodingStudy calendar pages and full review-note bodies."
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
