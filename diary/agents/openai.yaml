interface:
  display_name: "Study Diary"
  short_description: "Publish Issues and explained code-based Notion reviews."
  default_prompt: "Use $diary to publish one labelled Issue per study topic, index it in MyDiary, write a detailed Notion CodingStudy review that pairs concept explanations with relevant code and execution walkthroughs, and map it to earlier learning."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Notion MCP server for CodingStudy calendar pages and full review-note bodies."
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
